<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapsible Sidebar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-head">
                <div class="logo">
                    <span class="logo-mark">E</span>
                    <span class="logo-text">Elevvo</span>
                </div>
            </div>

            <nav class="menu">
                <a class="menu-item active" href="#">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
                    <span class="label">Dashboard</span>
                </a>
                <a class="menu-item" href="#">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 20h3v-8H4zm6.5 0h3V4h-3zM17 20h3v-12h-3z"/></svg>
                    <span class="label">Analytics</span>
                </a>
                <a class="menu-item" href="#">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span class="label">Projects</span>
                </a>
                <a class="menu-item" href="#">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8m9 4a9 9 0 0 1-.1 1.3l2 1.6-2 3.4-2.4-1a9 9 0 0 1-2.2 1.3l-.4 2.4h-4l-.4-2.4a9 9 0 0 1-2.2-1.3l-2.4 1-2-3.4 2-1.6a9 9 0 0 1 0-2.6l-2-1.6 2-3.4 2.4 1a9 9 0 0 1 2.2-1.3L10 2h4l.4 2.4a9 9 0 0 1 2.2 1.3l2.4-1 2 3.4-2 1.6c.06.43.1.86.1 1.3"/></svg>
                    <span class="label">Settings</span>
                </a>
                <a class="menu-item" href="#">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10m0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5"/></svg>
                    <span class="label">Profile</span>
                </a>
            </nav>

        </aside>

        <main class="content">
            <header class="topbar">
                <button class="toggle" id="toggle" aria-label="Toggle sidebar" aria-expanded="true">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
                </button>
                <h1>Dashboard</h1>
            </header>

            <section class="page">
                <p>Click the button in the top bar to open and close the sidebar.</p>
            </section>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
